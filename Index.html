<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>App Directory</title>
    <meta name="description" content="A clean directory of original gaming app destinations.">
    <style>
        :root {
            --paper: #f5f1e8;
            --ink: #202b2b;
            --muted: #687a72;
            --line: #deded6;
            --red: #b4312d;
            --green: #197957;
            --soft: #e7eee8
        }
        * {
            box-sizing: border-box
        }
        html {
            scroll-behavior: smooth
        }
        body {
            margin: 0;
            min-width: 320px;
            background: radial-gradient(circle at 5% 0%, #19795714, transparent 22rem), radial-gradient(circle at 96% 22%, #b4312d14, transparent 20rem), var(--paper);
            color: var(--ink);
            font-family: Manrope, Arial, sans-serif;
            -webkit-font-smoothing: antialiased
        }
        button,
        a {
            -webkit-tap-highlight-color: transparent
        }
        button {
            font: inherit
        }
        .shell {
            min-height: 100vh;
            overflow-x: hidden
        }
        .container {
            width: min(920px, calc(100% - 24px));
            margin: auto
        }
        .nav-wrap {
            padding-top: 12px
        }
        .nav {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 6px;
            padding: 5px;
            border: 1px solid #dddcd4;
            border-radius: 16px;
            background: #eeeae1
        }
        .nav-center {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 4px
        }
        .nav button {
            min-width: 0;
            min-height: 38px;
            padding: 8px 7px;
            border: 0;
            border-radius: 12px;
            background: transparent;
            color: #64716c;
            cursor: pointer;
            font-size: 12px;
            font-weight: 800;
            line-height: 1.1;
            white-space: nowrap
        }
        .nav button:hover,
        .nav button.active {
            background: var(--ink);
            color: #fffaf1
        }
        .nav-side {
            display: flex
        }
        .nav-side button {
            min-width: 62px
        }
        .cards {
            display: grid;
            gap: 10px;
            padding: 16px 0 64px
        }
        .card {
            display: grid;
            grid-template-columns: 78px minmax(0, 1fr) auto;
            align-items: center;
            gap: 11px;
            position: relative;
            min-width: 0;
            padding: 12px 10px 12px 15px;
            border: 1px solid #e3e3dc;
            border-radius: 21px;
            background: #fff;
            box-shadow: 0 5px 18px #1c281f0e;
            animation: rise .45s both
        }
        .number {
            position: absolute;
            top: 8px;
            left: 7px;
            z-index: 2;
            display: grid;
            place-items: center;
            min-width: 29px;
            height: 29px;
            padding: 0 7px;
            border: 2px solid #fff;
            border-radius: 999px;
            background: var(--green);
            color: #fff;
            font: 800 10px 'DM Mono', monospace;
            box-shadow: 0 3px 8px #0003
        }
        .image {
            width: 78px;
            height: 78px;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid #e7e7e2;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center
        }
        .image img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            background: transparent
        }
        .details {
            min-width: 0
        }
        .name {
            margin: 0;
            color: #171b1a;
            font: 700 clamp(.92rem, 2.2vw, 1.3rem)/1.08 'Space Grotesk', Arial, sans-serif;
            letter-spacing: -.035em;
            overflow-wrap: anywhere
        }
        .meta {
            display: grid;
            gap: 5px;
            margin-top: 8px;
            color: #171b1a;
            font-size: clamp(.68rem, 1.4vw, .9rem);
            font-weight: 700;
            line-height: 1.15
        }
        .meta-line {
            display: flex;
            min-width: 0;
            align-items: center;
            gap: 6px
        }
        .meta-line.bonus {
            gap: 5px;
            flex-wrap: wrap
        }
        .meta-line.bonus .bonus-label {
            display: inline-flex;
            align-items: center;
            gap: 5px
        }
        .bonus-value {
            font-weight: 900;
            color: #c62d2e;
            white-space: nowrap
        }
        .icon {
            width: 16px;
            height: 16px;
            flex: 0 0 16px
        }
        .download {
            display: flex;
            min-height: 48px;
            width: 96px;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 7px;
            border-radius: 13px;
            background: var(--green);
            color: #fff;
            font-size: .74rem;
            font-weight: 800;
            text-decoration: none;
            box-shadow: inset 0 -2px #00000059, 0 5px 12px #1c281f29;
            transition: .2s
        }
        .download:hover {
            background: #126247;
            transform: translateY(-2px)
        }
        .download svg {
            width: 15px;
            height: 15px;
            flex: 0 0 15px
        }
        .home-tags {
            margin: 0 auto 64px;
            padding: 24px 18px
        }
        .home-tags h2 {
            margin: 0;
            color: #171b1a;
            font: 800 1.15rem/1.1 'Space Grotesk', Arial, sans-serif
        }
        .home-tags .eyebrow {
            margin-bottom: 7px
        }
        .home-tags .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 16px
        }
        .home-tags .tag {
            padding: 8px 10px;
            border: 1px solid #dfe7e1;
            border-radius: 999px;
            background: var(--soft);
            color: #36504b;
            font-size: 11px;
            font-weight: 800
        }
        .page {
            width: min(920px, calc(100% - 24px));
            margin: 24px auto 64px;
            padding: 30px 20px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 8px 24px #1c281f0d
        }
        .eyebrow {
            margin: 0;
            color: var(--red);
            font: 500 10px 'DM Mono', monospace;
            letter-spacing: .16em;
            text-transform: uppercase
        }
        .page h1 {
            max-width: 680px;
            margin: 12px 0 0;
            font: 700 clamp(1.65rem, 5vw, 3.1rem)/.98 'Space Grotesk', Arial, sans-serif;
            letter-spacing: -.06em
        }
        .page p {
            max-width: 680px;
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.65
        }
        .info-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 24px
        }
        .info-tag {
            padding: 9px 12px;
            border-radius: 99px;
            background: var(--soft);
            color: #36504b;
            font-size: 12px;
            font-weight: 800
        }
        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(10px)
            }
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }
        @keyframes countPulse {
            0% {
                transform: scale(1)
            }
            40% {
                transform: scale(1.12)
            }
            70% {
                transform: scale(0.96)
            }
            100% {
                transform: scale(1)
            }
        }
        .counter-anim {
            display: inline-block;
            animation: countPulse .6s ease-out
        }
        @media(prefers-reduced-motion:reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important
            }
        }
        @media(max-width:390px) {
            .nav {
                gap: 3px;
                padding: 4px
            }
            .nav button {
                font-size: 10.5px;
                min-height: 36px;
                padding: 7px 4px
            }
            .nav-side button {
                min-width: 58px
            }
            .card {
                grid-template-columns: 72px minmax(0, 1fr) 86px;
                gap: 8px;
                padding-left: 13px
            }
            .image {
                width: 72px;
                height: 72px
            }
            .download {
                width: 86px;
                min-height: 46px;
                font-size: .68rem;
                gap: 4px;
                padding-inline: 4px
            }
            .download svg {
                width: 14px;
                height: 14px;
                flex-basis: 14px
            }
            .name {
                font-size: .88rem
            }
            .meta {
                font-size: .63rem
            }
            .icon {
                width: 14px;
                height: 14px;
                flex-basis: 14px
            }
            .meta-line.bonus {
                gap: 3px
            }
            .meta-line.bonus .bonus-label {
                gap: 3px
            }
        }
        @media(min-width:640px) {
            .nav-wrap {
                padding-top: 20px
            }
            .nav button {
                min-height: 42px;
                font-size: 13px
            }
            .cards {
                padding-top: 20px
            }
            .card {
                grid-template-columns: 90px minmax(0, 1fr) 140px;
                gap: 16px;
                padding: 16px 16px 16px 20px
            }
            .image {
                width: 90px;
                height: 90px
            }
            .download {
                width: 140px;
                min-height: 54px;
                font-size: .95rem
            }
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            color: var(--ink);
            font-size: 15px;
            font-weight: 800;
            text-decoration: none
        }
        .detail-page {
            padding: 20px 18px 44px
        }
        .detail-hero {
            display: grid;
            grid-template-columns: 110px minmax(0, 1fr);
            gap: 18px;
            align-items: center
        }
        .detail-image {
            width: 110px;
            height: 110px;
            border: 1px solid #e3e3dc;
            border-radius: 22px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 8px 20px #1c281f12
        }
        .detail-image img {
            width: 100%;
            height: 100%;
            object-fit: contain
        }
        .detail-heading {
            min-width: 0
        }
        .detail-heading h1 {
            margin: 7px 0 0;
            font: 700 clamp(1.7rem, 5vw, 3rem)/1 'Space Grotesk', Arial, sans-serif;
            letter-spacing: -.055em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip
        }
        .detail-rating {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 12px;
            color: #f0a000;
            font-size: 24px;
            line-height: 1
        }
        .detail-rating .rating-number {
            color: #40504c;
            font-size: 15px;
            font-weight: 800
        }
        .detail-update {
            display: inline-flex;
            margin-top: 13px;
            padding: 8px 14px;
            border: 1px solid #f1c9c7;
            border-radius: 999px;
            background: #fff8f7;
            color: #c62d2e;
            font-size: 13px;
            font-weight: 900
        }
        .detail-stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin: 20px 0 12px
        }
        .detail-stats span {
            min-width: 0;
            padding: 8px 5px;
            background: transparent;
            color: #202b2b;
            font-size: 11px;
            font-weight: 800;
            text-align: center
        }
        .detail-stat-value {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: clamp(1.35rem, 4vw, 2rem);
            font-weight: 900;
            line-height: 1
        }
        .detail-stat-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-top: 7px;
            font-size: clamp(.85rem, 2.5vw, 1rem);
            font-weight: 500;
            white-space: nowrap
        }
        .detail-stat-label svg {
            width: 19px;
            height: 19px;
            flex: 0 0 19px
        }
        .detail-stat-bonus .detail-stat-value {
            color: #202b2b
        }
        .detail-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-height: 54px;
            padding: 12px 16px;
            border-radius: 15px;
            background: var(--green);
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 900;
            box-shadow: inset 0 -2px #00000035, 0 7px 16px #1c281f24
        }
        .detail-download svg {
            width: 19px;
            height: 19px;
            flex: 0 0 19px
        }
        .detail-download {
            position: relative;
            z-index: 2;
            margin-bottom: 0;
        }
        .app-trust-card {
            z-index: 1;
        }
        .unique-tags {
            margin-top: 25px
        }
        .unique-tags>.eyebrow {
            margin-bottom: 9px
        }
        /* FIXED LAYOUT: horizontal wrapping, no vertical list */
        .tag-grid {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: flex-start;
            align-items: flex-start;
            width: 100%;
            gap: 8px;
        }
        .detail-tag {
            display: inline-flex;
            width: auto;
            flex: 0 0 auto;
            max-width: 100%;
            padding: 10px 11px;
            border: 1px solid #dfe7e1;
            border-radius: 13px;
            background: var(--soft);
            color: #36504b;
            font-size: 11px;
            font-weight: 800;
            line-height: 1.25;
            white-space: nowrap;
            overflow-wrap: anywhere;
        }
        .related-section {
            margin-top: 32px
        }
        .related-section h2 {
            margin: 7px 0 14px;
            font: 800 1.2rem/1.1 'Space Grotesk', Arial, sans-serif
        }
        .related-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px
        }
        .related-grid .card .meta {
            min-width: 0
        }
        .related-grid .card .meta-line.bonus {
            flex-wrap: nowrap
        }
        .related-card {
            position: relative;
            display: grid;
            grid-template-columns: 58px minmax(0, 1fr);
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border: 1px solid #e3e3dc;
            border-radius: 15px;
            background: #fff;
            color: var(--ink);
            text-decoration: none;
            box-shadow: 0 4px 12px #1c281f0b;
            min-height: 70px
        }
        .related-card img {
            width: 58px;
            height: 58px;
            border-radius: 10px;
            object-fit: contain;
            background: transparent
        }
        .related-card>span:last-child {
            font-size: 13px;
            font-weight: 900;
            line-height: 1.2;
            overflow-wrap: anywhere
        }
        .related-number {
            display: none !important
        }
        @media(max-width:390px) {
            .detail-page {
                padding-inline: 14px
            }
            .detail-hero {
                grid-template-columns: 82px minmax(0, 1fr);
                gap: 12px
            }
            .detail-image {
                width: 82px;
                height: 82px;
                border-radius: 17px
            }
            .detail-heading h1 {
                font-size: clamp(.98rem, 5.5vw, 1.45rem);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: clip
            }
            .detail-rating {
                font-size: 20px;
                gap: 5px
            }
            .detail-rating .rating-number {
                font-size: 13px
            }
            .detail-update {
                font-size: 10px;
                padding: 7px 10px;
                margin-top: 10px
            }
            .detail-stats {
                gap: 2px;
                margin-top: 18px
            }
            .detail-stats span {
                font-size: 9.5px;
                padding: 7px 2px
            }
            .detail-stat-value {
                font-size: 1.28rem
            }
            .detail-stat-label {
                font-size: .76rem;
                gap: 3px
            }
            .detail-stat-label svg {
                width: 16px;
                height: 16px;
                flex-basis: 16px
            }
            .detail-download {
                font-size: 14px;
                min-height: 50px
            }
            .tag-grid {
                gap: 6px;
            }
            .detail-tag {
                font-size: 10px;
                padding: 9px;
            }
            .related-grid {
                grid-template-columns: 1fr
            }
            .related-card {
                grid-template-columns: 48px minmax(0, 1fr);
                min-height: 60px
            }
            .related-card img {
                width: 48px;
                height: 48px
            }
        }
        @media(min-width:640px) {
            .detail-page {
                padding: 28px 24px 60px
            }
            .detail-hero {
                grid-template-columns: 150px minmax(0, 1fr)
            }
            .detail-image {
                width: 150px;
                height: 150px
            }
            .related-grid {
                grid-template-columns: 1fr
            }
            .tag-grid {
                gap: 10px;
            }
            .detail-tag {
                font-size: 12px;
                padding: 11px 13px;
            }
        }
        .detail-stars {
            width: 120px;
            height: 24px;
            display: block;
            flex: 0 0 auto
        }
        .detail-version {
            margin-left: 8px;
            white-space: nowrap
        }
        .detail-update {
            white-space: nowrap;
            align-items: center;
            gap: 2px
        }
        @media(max-width:390px) {
            .detail-stars {
                width: 100px;
                height: 21px
            }
            .detail-version {
                margin-left: 5px
            }
            .detail-update {
                font-size: 9.5px;
                padding-inline: 9px
            }
            .related-grid .card .name {
                font-size: clamp(.72rem, 4.1vw, .88rem);
                white-space: nowrap;
                overflow: visible
            }
            .related-grid .card .meta-line.bonus {
                white-space: nowrap;
                flex-wrap: nowrap
            }
            .related-grid .card .bonus-value {
                white-space: nowrap;
                flex: 0 0 auto
            }
        }
        /* Keep home/related card text on one line */
        .meta-line { flex-wrap: nowrap; white-space: nowrap; }
        .meta-line.bonus { flex-wrap: nowrap; }
        .meta-line.bonus .bonus-label { flex-wrap: nowrap; white-space: nowrap; }
        .bonus-value { flex: 0 0 auto; }
        @media(max-width:390px) {
            .meta-line { white-space: nowrap; }
            .meta-line.bonus .bonus-label { font-size: inherit; }
        }

        /* bonus left align tweaks */
        .meta-line.bonus .bonus-label {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap
        }
        .meta-line.bonus .bonus-label .bonus-value {
            margin-left: 0
        }
        .detail-stat-bonus .detail-stat-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px
        }
        .detail-stat-bonus .detail-stat-label svg {
            flex: 0 0 19px
        }
        .detail-stat-bonus .detail-stat-value {
            display: inline-flex;
            align-items: center;
            gap: 4px
        }
        .detail-bonus-line {
            font-size: clamp(.82rem, 2.4vw, 1.15rem) !important;
            white-space: nowrap;
            gap: 6px !important;
        }
        .detail-bonus-line svg { width: 18px; height: 18px; flex: 0 0 18px; }
        .detail-bonus-line b { color: #c62d2e; font-weight: 900; }
        /* related card bonus left align */
        .related-grid .card .meta-line.bonus {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap
        }
        .related-grid .card .meta-line.bonus .bonus-label {
            display: inline-flex;
            align-items: center;
            gap: 5px
        }
        .detail-stat-value .counter-number {
            display: inline-block;
            font-weight: 900;
            font-size: inherit;
            line-height: 1;
        }
        .counter-number.animating {
            animation: countPulse .5s ease-out
        }

        /* Floating scroll-to-top button */
        .scroll-top {
            position: fixed;
            right: 16px;
            bottom: max(18px, env(safe-area-inset-bottom));
            z-index: 2147483647;
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,.65);
            border-radius: 18px;
            background: var(--green);
            color: #fff;
            box-shadow: 0 10px 26px rgba(25,121,87,.34), inset 0 -2px rgba(0,0,0,.18);
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            transform: translateY(18px) scale(.9);
            transition: opacity .22s ease, transform .22s ease, visibility .22s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .scroll-top.show {
            opacity: 1 !important;
            pointer-events: auto !important;
            visibility: visible !important;
            transform: translateY(0) scale(1) !important;
            animation: topFloat 1.8s ease-in-out infinite;
        }
        .scroll-top svg { width: 26px; height: 26px; }
        .scroll-top:active { transform: translateY(1px) scale(.96); }
        @keyframes topFloat {
            0%,100% { box-shadow: 0 10px 26px rgba(25,121,87,.34), inset 0 -2px rgba(0,0,0,.18); }
            50% { box-shadow: 0 14px 30px rgba(25,121,87,.48), inset 0 -2px rgba(0,0,0,.18); }
        }
        @media(max-width:390px) { .scroll-top { right: 12px; bottom: max(14px, env(safe-area-inset-bottom)); width: 50px; height: 50px; border-radius: 16px; } }

        /* Final Details page stats: 3 perfectly aligned columns */
        .detail-stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            column-gap: 6px;
            row-gap: 0;
            align-items: start;
            width: 100%;
            overflow: visible;
        }
        .detail-stats > span {
            min-width: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            padding: 8px 0;
            overflow: visible;
        }
        .detail-stat-value {
            display: block;
            width: 100%;
            white-space: nowrap;
            text-align: center;
            line-height: 1.05;
            font-size: clamp(1.15rem, 4.6vw, 2rem);
            font-weight: 900;
            overflow: visible;
        }
        .detail-stat-label {
            display: inline-flex;
            width: auto;
            align-items: center;

        window.addEventListener('resize', updateScrollTopVisibility, { passive: true });
        if (scrollTopButton) scrollTopButton.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
        });
        updateScrollTopVisibility();

        function setPage(page) {
            if (page === 'home') { history.pushState({}, '', location.pathname + location.search);
                renderHome(); } else { history.pushState({}, '', `#${page}`);
                renderInfo(page); }
            document.querySelectorAll('[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === page));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function route() {
            const hash = location.hash.replace(/^#/, '');
            const m = hash.match(/^app=(\d+)$/);
            if (m) { const i = Number(m[1]); if (i >= 0 && i < apps.length) { renderDetail(i);
                    document.querySelectorAll('[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === 'home'));
                    return; } }
            if (['about', 'contact', 'disclaimer', 'privacy'].includes(hash)) { renderInfo(hash);
                document.querySelectorAll('[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === hash));
                return; }
            renderHome();
            document.querySelectorAll('[data-page]').forEach(b => b.classList.toggle('active', b.dataset.page === 'home'));
        }
        document.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => setPage(b.dataset.page)));
        window.addEventListener('popstate', route);
        window.addEventListener('hashchange', route);
        route();
    </script>
</body>
</html>
