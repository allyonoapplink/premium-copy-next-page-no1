<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0b1220;
color:#fff;
}

.topbar{
position:sticky;
top:0;
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 18px;
background:rgba(15,23,42,.95);
backdrop-filter:blur(15px);
box-shadow:0 4px 20px rgba(0,255,255,.3);
z-index:999;
}

.logo{
font-size:22px;
font-weight:bold;
color:#00f7ff;
text-shadow:0 0 12px #00f7ff;
}

.menu-btn{
background:none;
border:none;
color:#fff;
font-size:28px;
cursor:pointer;
}

.dropdown{
display:none;
position:absolute;
right:15px;
top:60px;
background:#18243d;
border-radius:15px;
overflow:hidden;
box-shadow:0 8px 25px rgba(0,255,255,.35);
min-width:180px;
}

.dropdown a{
display:flex;
align-items:center;
gap:10px;
padding:14px 18px;
color:#fff;
text-decoration:none;
font-size:17px;
transition:.3s;
}

.dropdown a:hover{
background:#00c8ff;
color:#000;
}

.card{
margin:18px;
padding:20px;
background:#152238;
border-radius:20px;
box-shadow:0 0 18px rgba(0,255,255,.25);
}

h1,h2{
color:#00f7ff;
}

p,li{
line-height:1.8;
font-size:16px;
color:#ddd;
}
</style>

<div class="topbar">

<div class="logo">
YONO GAMES SITE
</div>

<div style="position:relative">

<button class="menu-btn" onclick="menuToggle()">
<i class="fas fa-ellipsis-vertical"></i>
</button>

<div class="dropdown" id="menu">

<a href="javascript:history.back()">
<i class="fas fa-times-circle"></i>
✖️ Close
</a>

</div>

</div>

</div>

<script>
function menuToggle(){
var x=document.getElementById("menu");
x.style.display=(x.style.display==="block")?"none":"block";
}

window.onclick=function(e){
if(!e.target.closest(".menu-btn")){
document.getElementById("menu").style.display="none";
}
}
</script>
